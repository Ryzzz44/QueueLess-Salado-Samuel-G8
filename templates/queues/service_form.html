{% extends 'base.html' %}
{% block title %}{{ title }} | QueueLess{% endblock %}
{% block content %}
<div class="card mx-auto" style="max-width:640px;">
    <div class="card-body p-4 p-md-5">
        <h3 class="fw-bold mb-1"><i class="bi bi-gear" style="color:var(--ql-primary)"></i> {{ title }}</h3>
        <p class="text-muted mb-4">Students will see open services on their Join Queue page.</p>
        <form method="post" novalidate>
            {% csrf_token %}
            {% include 'form_fields.html' %}
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary px-4"><i class="bi bi-check2"></i> Save</button>
                <a href="{% url 'service_manage_list' %}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
