{% extends 'base.html' %}
{% block title %}Join {{ service.name }} | QueueLess{% endblock %}
{% block content %}
<div class="card mx-auto" style="max-width:560px;">
    <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
            <div class="auth-logo mb-3"><i class="bi bi-ticket-perforated"></i></div>
            <h3 class="fw-bold mb-1">{{ service.name }}</h3>
            <p class="text-muted mb-0">{{ service.office }} &middot; {{ service.waiting_count }} waiting now</p>
        </div>
        <form method="post" novalidate>
            {% csrf_token %}
            {% include 'form_fields.html' %}
            <button type="submit" class="btn btn-primary w-100 py-2"><i class="bi bi-check2-circle"></i> Get My Queue Number</button>
        </form>
        <p class="mt-3 mb-0 text-center"><a href="{% url 'service_list' %}">&larr; Back to services</a></p>
    </div>
</div>
{% endblock %}
