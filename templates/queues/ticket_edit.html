{% extends 'base.html' %}
{% block title %}Edit Ticket | QueueLess{% endblock %}
{% block content %}
<div class="card mx-auto" style="max-width:560px;">
    <div class="card-body p-4 p-md-5">
        <h3 class="fw-bold mb-1"><i class="bi bi-pencil-square" style="color:var(--ql-primary)"></i> Edit Ticket {{ ticket.ticket_code }}</h3>
        <p class="text-muted mb-4">You keep your place in line.</p>
        <form method="post" novalidate>
            {% csrf_token %}
            {% include 'form_fields.html' %}
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary px-4"><i class="bi bi-check2"></i> Save</button>
                <a href="{% url 'ticket_detail' ticket.pk %}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
