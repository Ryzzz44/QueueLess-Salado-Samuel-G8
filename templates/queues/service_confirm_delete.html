{% extends 'base.html' %}
{% block title %}Delete Service | QueueLess{% endblock %}
{% block content %}
<div class="card mx-auto" style="max-width:520px;">
    <div class="card-body p-4 p-md-5 text-center">
        <div class="ql-icon mx-auto" style="background:#fef2f2;color:#dc2626;"><i class="bi bi-trash"></i></div>
        <h4 class="fw-bold">Delete "{{ service.name }}"?</h4>
        <p class="text-muted">This cannot be undone. Services that already have queue records can't be deleted. Close them instead.</p>
        <form method="post" class="d-flex gap-2 justify-content-center">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger px-4">Yes, delete</button>
            <a href="{% url 'service_manage_list' %}" class="btn btn-outline-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
