{% extends 'base.html' %}
{% block title %}Remove Ticket | QueueLess{% endblock %}
{% block content %}
<div class="card mx-auto" style="max-width:520px;">
    <div class="card-body p-4 p-md-5 text-center">
        <div class="ql-icon mx-auto" style="background:#fef2f2;color:#dc2626;"><i class="bi bi-trash"></i></div>
        <h4 class="fw-bold">Remove {{ ticket.ticket_code }} from your history?</h4>
        <p class="text-muted">{{ ticket.service.name }} &middot; {{ ticket.queue_date|date:"F j, Y" }}</p>
        <form method="post" class="d-flex gap-2 justify-content-center">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger px-4">Yes, remove</button>
            <a href="{% url 'my_tickets' %}" class="btn btn-outline-secondary">Cancel</a>
        </form>
    </div>
</div>
{% endblock %}
