{% extends 'base.html' %}
{% block title %}Register | QueueLess{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm">
            <div class="card-body p-4">
                <h3 class="mb-1">Create an Account</h3>
                <p class="text-muted">Register as a student to join service queues.</p>
                <form method="post" novalidate>
                    {% csrf_token %}
                    {% include 'form_fields.html' %}
                    <button type="submit" class="btn btn-primary w-100">Register</button>
                </form>
                <p class="mt-3 mb-0 text-center">Already have an account? <a href="{% url 'login' %}">Log in</a></p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
