{% extends 'base.html' %}
{% block title %}Register | QueueLess{% endblock %}
{% block content %}
<div class="card auth-card" style="max-width:560px;">
    <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
            <div class="auth-logo mb-3"><i class="bi bi-person-plus"></i></div>
            <h3 class="fw-bold mb-1">Create your account</h3>
            <p class="text-muted mb-0">Register as a student to join service queues online.</p>
        </div>
        <form method="post" novalidate>
            {% csrf_token %}
            {% include 'form_fields.html' %}
            <button type="submit" class="btn btn-primary w-100 py-2"><i class="bi bi-check2-circle"></i> Register</button>
        </form>
        <p class="mt-4 mb-0 text-center text-muted">Already have an account? <a href="{% url 'login' %}" class="fw-semibold">Log in</a></p>
    </div>
</div>
{% endblock %}
