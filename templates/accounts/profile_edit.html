{% extends 'base.html' %}
{% block title %}Edit Profile | QueueLess{% endblock %}
{% block content %}
<div class="card mx-auto" style="max-width:640px;">
    <div class="card-body p-4 p-md-5">
        <h3 class="fw-bold mb-1"><i class="bi bi-pencil-square" style="color:var(--ql-primary)"></i> Edit Profile</h3>
        <p class="text-muted mb-4">Update your personal details below.</p>
        <form method="post" enctype="multipart/form-data" novalidate>
            {% csrf_token %}
            {% include 'form_fields.html' %}
            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary px-4"><i class="bi bi-check2"></i> Save Changes</button>
                <a href="{% url 'profile' %}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
