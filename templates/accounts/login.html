{% extends 'base.html' %}
{% block title %}Login | QueueLess{% endblock %}
{% block content %}
<div class="card auth-card">
    <div class="card-body p-4 p-md-5">
        <div class="text-center mb-4">
            <div class="auth-logo mb-3"><i class="bi bi-hourglass-split"></i></div>
            <h3 class="fw-bold mb-1">Welcome back</h3>
            <p class="text-muted mb-0">Log in to check your place in line.</p>
        </div>
        <form method="post" novalidate>
            {% csrf_token %}
            {% include 'form_fields.html' %}
            <button type="submit" class="btn btn-primary w-100 py-2"><i class="bi bi-box-arrow-in-right"></i> Log In</button>
        </form>
        <p class="mt-4 mb-0 text-center text-muted">No account yet? <a href="{% url 'register' %}" class="fw-semibold">Create one</a></p>
    </div>
</div>
{% endblock %}
