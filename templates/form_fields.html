{% for error in form.non_field_errors %}
    <div class="alert alert-danger py-2">{{ error }}</div>
{% endfor %}
{% for field in form %}
    <div class="mb-3">
        <label class="form-label fw-semibold" for="{{ field.id_for_label }}">{{ field.label }}</label>
        <input type="{{ field.field.widget.input_type }}" name="{{ field.html_name }}" id="{{ field.id_for_label }}"
               class="form-control {% if field.errors %}is-invalid{% endif %}"
               {% if field.field.widget.input_type != 'password' and field.field.widget.input_type != 'file' and field.value %}value="{{ field.value }}"{% endif %}
               {% if field.field.required %}required{% endif %}>
        {% for error in field.errors %}
            <div class="invalid-feedback">{{ error }}</div>
        {% endfor %}
        {% if field.help_text and not field.errors %}
            <div class="form-text">{{ field.help_text|safe }}</div>
        {% endif %}
    </div>
{% endfor %}
